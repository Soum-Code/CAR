[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "car"
version = "0.1.0"
description = "CAR - Conformalized Agentic Reasoning: calibrated selective verification for multi-step LLM reasoning"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Only needed on the GPU machine. CPU development works without these.
model = [
    "torch>=2.2",
    "transformers>=4.40",
    "accelerate>=0.29",
    "datasets>=2.19",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
car = "car.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
