# CAR default experiment configuration.
#
# This file is hashed into every run manifest. If the hash of the config that
# produced a calibration threshold differs from the one in the test run,
# something was retuned between them -- which is how test leakage is caught.

seed: 0

backend:
  kind: mock          # mock | hf
  seed: 0
  # mock-only knobs
  signal_strength: 0.8    # 0.0 = uncertainty is pure noise (null hypothesis)
  base_error_rate: 0.25
  # hf-only knobs
  # model_id: meta-llama/Llama-3.1-8B-Instruct
  # dtype: bfloat16       # see README: do not casually quantise
  # device: cuda

cache:
  enabled: true
  dir: .cache/generations

generation:
  n_steps: 4
  # Dominant compute cost: n_samples extra forward passes per step per
  # question. Budget this explicitly before scaling the dataset.
  n_samples: 5
  temperature: 0.7

uncertainty:
  # Zero a weight to ablate that signal; the code path stays identical.
  weights:
    token_entropy: 1.0
    max_surprisal: 0.5
    mean_logprob: 0.0
    semantic_divergence: 1.0
    task_verifier_signal: 0.0
  fit_weights: logistic   # logistic | uniform

conformal:
  kind: adaptive          # split | crc | adaptive

  # ---- risk target -------------------------------------------------------
  #
  # alpha is a RISK target, not an accuracy target, and it is not free to
  # choose. Kotte (arXiv:2606.29054) Prop. 3: when base risk mu > alpha, ANY
  # distribution-free method must verify or abstain on at least
  # (mu - alpha)/(1 - alpha) of steps. No score, calibrator or gate escapes it.
  #
  # Measured on GSM8K (Math-Shepherd, Mistral-7B-SFT, 93k steps):
  #
  #   mu_global ~ 0.3908   step does not lead to a correct answer
  #   mu_local  ~ 0.1011   step's arithmetic is actually wrong
  #
  # Floors against mu_global:
  #
  #   alpha   0.05    0.10    0.20    0.30    0.40
  #   floor  35.9%   32.3%   23.9%   13.0%   none
  #
  # This project previously used alpha: 0.1, which is NOT a modest target --
  # against global risk it charges a 32% verification entry fee before any
  # method is admissible. Changed to 0.30: a 13% floor is affordable against
  # the 37.5% budget, and it sits inside the 0.30-0.40 band Kotte found
  # workable for LLM tasks. alpha: 0.40 is the first floor-free value but is a
  # weak guarantee; 0.10 is only defensible against LOCAL risk.
  alpha: 0.30

  # Which risk the gate actually calibrates. A verifier reports LOCAL validity,
  # so that is what a conformal layer can control directly -- but ~70% of
  # globally-wrong steps are locally valid, so controlling local risk bounds
  # nothing about the answer. Stating the target explicitly stops the two being
  # silently conflated in the results.
  risk: global            # global | local
  base_risk_mu: 0.3908    # measured; re-measure for a different generator

  # The spec's own success criteria call for a trade-off curve, not a single
  # number. Experiments sweep; `alpha` above is only the operating point.
  alpha_sweep: [0.10, 0.20, 0.30, 0.40, 0.50]

  # Fail at setup if the budget sits below the Kotte floor, rather than
  # discovering it from a flat results table.
  enforce_feasibility: true

  # adaptive-only
  gamma: 0.005
  epsilon: 0.2            # forced exploration rate; 0.0 reproduces censoring
  update_mode: ipw        # naive | exploration_only | ipw

control:
  # Structural allocation signal. NOT influence-weighting: descendant-count
  # weighting was tested on chains, on five synthetic DAG families and on real
  # extracted graphs, and lost to uniform every time. Ancestor count ("depth")
  # won on StrategyQA shapes, bottleneck weight ("cut") on GSM8K, so the signal
  # is benchmark-dependent and should be picked on DEV data, not assumed.
  # See docs/FINDINGS-PROPAGATION.md.
  allocation: cut         # uniform | front | back | influence | depth | cut
  influence: none         # retained for the ablation; "sqrt" reproduces the old default
  influence_cap: 4.0

  # Mean GSM8K solution is 3.59 steps, so 2 calls ~= 56% of steps. That clears
  # the 13.0% Kotte floor for alpha=0.30 with room to spare, which is what
  # makes the accuracy-vs-cost sweep meaningful rather than budget-starved.
  budget_per_question: 2
  budget_fraction: 0.56   # checked against the floor at setup
  budget_policy: none     # none | linear
  abstain_threshold: null

verification:
  # Deterministic and independent of the generator, which is what makes it a
  # real verifier rather than a same-model critic. Pairs naturally with GSM8K,
  # where every step is an arithmetic transformation.
  kind: calculator        # calculator | retrieval | oracle | same_model_critic
  retrieval_k: 3

data:
  # PRIMARY: GSM8K. Switched from StrategyQA on evidence, not preference --
  # StrategyQA graphs are 72.9% one hop deep and only 11.2% of steps have any
  # non-terminal descendant, so propagation barely occurs. GSM8K has 2.4x the
  # headroom, depth reaching 8, and 5x as many questions at depth >= 3.
  # StrategyQA is kept for calibration and evidence-grounded verification.
  dataset: gsm8k          # mock | gsm8k | strategyqa
  path: data/raw/gsm8k/train.jsonl
  # Propagation and allocation claims need depth. Restricting to depth >= 3
  # keeps 3030 GSM8K questions, where policy spread is 0.044-0.114 rather than
  # the 0.016 seen on the shallow majority.
  min_depth: 3
  dev_frac: 0.3
  cal_frac: 0.3
  split_salt: car-v1

  secondary:
    dataset: strategyqa
    path: data/raw/strategyqa/strategyqa_train.json
    role: calibration and evidence-grounded verification only

output:
  run_dir: runs
  trace_file: trace.jsonl
